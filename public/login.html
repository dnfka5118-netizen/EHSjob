<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인 - EHS팀 업무관리 대시보드</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI','Malgun Gothic',sans-serif; background:#f5f6f8; color:#1f2430;}
  .box{background:#fff; border:1px solid #e3e5e9; border-radius:12px; padding:32px 30px; width:320px; box-shadow:0 4px 18px rgba(0,0,0,0.06);}
  .logo{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .logo .badge{background:#0f2a52; color:#fff; font-weight:800; font-size:12.5px; padding:6px 9px; border-radius:6px;}
  .logo .name{font-weight:700; font-size:15px;}
  h1{font-size:15px; margin:0 0 18px; color:#6b7280; font-weight:600;}
  label{display:block; font-size:12.5px; color:#6b7280; margin-bottom:5px; margin-top:12px;}
  input[type=text], input[type=password]{width:100%; padding:10px 11px; border:1px solid #e3e5e9; border-radius:7px; font-size:14px;}
  button{width:100%; margin-top:20px; background:#0f2a52; color:#fff; border:none; padding:11px; border-radius:7px; font-size:14px; font-weight:600; cursor:pointer;}
  button:hover{background:#173c72;}
  .error{margin-top:12px; font-size:12.5px; color:#c0392b; background:#fdecec; padding:8px 10px; border-radius:6px; display:none;}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><div class="badge">EHS</div><div class="name">삼영순화(주) EHS팀</div></div>
    <h1>업무관리 대시보드에 로그인하세요</h1>
    <form id="loginForm">
      <label for="username">아이디</label>
      <input type="text" id="username" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <div class="error" id="errorBox"></div>
      <button type="submit">로그인</button>
    </form>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';
  try{
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    if(res.ok){
      window.location.href = '/';
    } else {
      const data = await res.json().catch(()=>({}));
      errorBox.textContent = data.error || '아이디 또는 비밀번호가 올바르지 않습니다.';
      errorBox.style.display = 'block';
    }
  } catch(err){
    errorBox.textContent = '서버에 연결할 수 없습니다.';
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
